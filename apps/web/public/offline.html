<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Tuktak</title>
    <meta name="theme-color" content="#10b981" />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #fafafa;
        color: #1a1a1a;
        text-align: center;
        padding: 1rem;
      }
      .container {
        max-width: 400px;
      }
      .icon {
        font-size: 4rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      p {
        color: #666;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 1.5rem;
      }
      .brand {
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: 2rem;
      }
      .brand span {
        color: #10b981;
      }
      button {
        background: #10b981;
        color: white;
        border: none;
        border-radius: 0.75rem;
        padding: 0.75rem 2rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="brand">Tuk<span>tak</span></div>
      <div class="icon">📡</div>
      <h1>You're offline</h1>
      <p>
        Looks like you've lost your internet connection. Don't worry — your cached pages are still
        available. Please check your connection and try again.
      </p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
